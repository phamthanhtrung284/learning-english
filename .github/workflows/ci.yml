name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      # backend tests
      MONGO_URI: mongodb://localhost:27017/learning_test
      JWT_SECRET: ci_jwt_secret
      GROQ_API_KEY: ci_dummy_key

      # keep build tools non-interactive
      CI: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Backend - install
        working-directory: backend-web
        run: npm ci

      - name: Backend - test
        working-directory: backend-web
        run: npm test

      - name: Frontend - install
        working-directory: frontend
        run: npm ci

      - name: Frontend - lint
        working-directory: frontend
        run: npm run lint

      - name: Frontend - build
        working-directory: frontend
        run: npm run build

